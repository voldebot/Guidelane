# Engine conformance — the free tier only.
#
# WHY THIS FILE CANNOT RUN THE FULL SUITE
# ---------------------------------------
# ADR-001's invariant is that Guidelane never holds a credential, and engines are
# official vendor binaries running under the *user's own login*. A GitHub runner
# has no such login, so `--live` (17 probes that make real engine calls) can only
# ever run on a machine where a human is already signed in.
#
# The split is therefore deliberate, not a limitation we forgot:
#   - here (CI):    free tier — help-text + observational probes, every push + daily.
#                   This is what catches a CLI release changing a flag or a
#                   help-text contract, which is REVIEW-01 #5's remedy.
#   - on a laptop:  `--live`, scheduled locally (see tools/probe/README-ci.md).
#                   This is what catches a change in runtime behaviour.
#
# HONESTY NOTE: the free tier has never been executed on a logged-out machine.
# Probes that shell out to `claude auth status --json` / `auto-mode config` are
# expected to still pass (they assert field *presence*, not a signed-in state),
# but that is reasoning, not measurement — REVIEW-02 B5 covers it. The first CI
# run is the measurement; if a probe fails only because the runner is logged
# out, fix the probe, do not weaken the assertion.

name: engine-conformance

on:
  push:
    paths:
      - 'tools/probe/**'
      - 'tools/gates/**'
      - 'docs/research/S0-conformance-*'
      - '.github/workflows/engine-conformance.yml'
      # Added S1: `packages/**` and the workspace root, because the `packages`
      # job below type-checks and tests them. Without these paths the job exists
      # but never fires on the commits that could break it — a gate that cannot
      # trigger is the same decoration as a guard that cannot fail.
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  pull_request:
  schedule:
    # 04:00 UTC daily — a new CLI release should be caught before the owner
    # starts work, not halfway through a build.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  free-tier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # Pinning is intentional: an unpinned install would make the probe test a
      # different engine every night, which is the opposite of version
      # governance. Bump this deliberately, then re-run --live locally before
      # the bump lands (CLAUDE.md §3, "tested CLI version range maintained").
      - name: Install the engine under test
        run: npm install -g @anthropic-ai/claude-code@2.1.220

      - name: Record the exercised version
        run: claude --version

      # Written outside the working tree, so the committed baseline cannot be
      # touched even by accident. Exit codes: 0 green · 1 the engine's contract
      # changed · 2 the harness broke · 3 inconclusive (stall/capacity).
      - name: Run the free tier
        run: node tools/probe/run.mjs --out "${RUNNER_TEMP}/probe-out"

      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Deliberately NOT named like the baseline: this is ~10 probes with no
          # live calls, and a reviewer downloading it must not mistake it for the
          # 30-probe conformance report.
          name: s0-conformance-FREE-TIER-partial
          path: ${{ runner.temp }}/probe-out/

      # Fail-closed. A `|| true` here would let a clobbered baseline through
      # green, which is the failure mode this whole job exists to prevent.
      - name: Assert the committed baseline was not modified
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code -- docs/research/

      # `if: always()` because without it ANY red probe run skipped the scan
      # entirely — so a commit that both broke a probe and added a leak shipped
      # unscanned, which is precisely the commit most likely to contain one.
      # The S2 source scanner has bounded exceptions for exactly one hostile
      # fixture and the repository-local generated-project identity. It checks
      # the identity as a whole lexical token, so a prefixed or suffixed email
      # still fails closed.
      - name: Assert the committed artifacts carry no identifiers
        if: always()
        run: node tools/gates/gate-artifacts.mjs --source-only

      # The uploaded artifact is publicly downloadable on a public repo and is
      # the only file here containing FRESH child-process output — i.e. the one
      # place a redaction regression would show up first. The committed-file
      # scan above cannot see it.
      - name: Assert the freshly generated report carries no identifiers
        if: always()
        run: |
          set -uo pipefail
          # Say so rather than exit 0 silently. "Nothing to scan" and "scanned
          # and clean" are different facts, and only one of them is evidence —
          # which is the entire lesson of the sprint that added this step.
          if [ ! -d "${RUNNER_TEMP}/probe-out" ]; then
            echo "::warning::No generated report to scan (the run step produced no output). NOT a clean result."
            exit 0
          fi
          if grep -rnEI -i \
               -e '/users/[a-z]' -e '/home/[a-z]' -e '/var/folders/' \
               -e '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' \
               "${RUNNER_TEMP}/probe-out"; then
            echo "::error::Redaction boundary failed on the freshly generated report."
            exit 1
          fi
          echo "Fresh report is clean."

  # The workspace gate. Added S1, when `packages/engine` shipped 45 tests that
  # nothing ran automatically — including the tests for `assertInitReceipt`, the
  # gate every phase passes through before a token is spent. A test suite with no
  # scheduled runner rots silently, which is the same failure mode as a guard
  # that cannot fire, one refactor away.
  #
  # This needs no engine and no login, so it is genuinely free and belongs in the
  # tier that runs on every push. The LIVE tests skip themselves: they are gated
  # on GUIDELANE_LIVE=1, which is deliberately not set here — a runner has no
  # subscription login and ADR-001 forbids putting one there.
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # `npm ci` and not `npm install`: the lockfile is the pinned expectation,
      # and a job that silently resolves a different dependency tree than the
      # developer's is testing something other than what ships.
      - name: Install workspace dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # The offline tier. `--if-present` in the root script means a package with
      # This job remains the package boundary; product-offline owns the cockpit
      # and generated-project harness. The aggregate count below asserts both
      # engine and orchestrator suites actually EXECUTED rather than trusting a
      # zero exit from a run that matched no files. npm prints one TAP summary
      # per selected workspace, so their pass counts are summed.
      - name: Test
        run: |
          set -o pipefail
          npm run test --workspace=@guidelane/engine --workspace=@guidelane/orchestrator 2>&1 | tee /tmp/test-out.txt
          PASSED=$(grep -oE '^# pass [0-9]+' /tmp/test-out.txt | grep -oE '[0-9]+' | awk '{ total += $1 } END { print total + 0 }')
          if [ "$PASSED" -lt 90 ]; then
            echo "::error::Expected at least 90 aggregate package tests, saw '$PASSED' — one or more package suites did not run."
            exit 1
          fi
          echo "Workspace suites executed: $PASSED aggregate passing."

  # REVIEW-01 #5's accepted remedy is "a nightly conformance probe against the
  # latest CLI". The pinned job above cannot do that by construction — it always
  # installs the version the suite was validated against, so a new release is
  # invisible to it forever. This job is the other half: it watches for drift
  # between the pin and what npm actually ships, and is allowed to fail loudly
  # without blocking the pinned signal.
  latest-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install the latest published CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Compare against the pinned version
        run: |
          set -uo pipefail
          PINNED=$(grep -oE '@anthropic-ai/claude-code@[0-9]+\.[0-9]+\.[0-9]+' \
                     .github/workflows/engine-conformance.yml | head -1 | sed 's/.*@//')
          LATEST=$(claude --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "pinned=$PINNED latest=$LATEST"
          if [ "$PINNED" != "$LATEST" ]; then
            echo "::warning::CLI $LATEST is published; the suite is validated against $PINNED."
            echo "Run the full --live suite locally against $LATEST, then bump the pin and the tested range."
            exit 1
          fi
          echo "Pin is current."

      # Runs regardless of the comparison, so a new release also tells us
      # immediately whether the free tier still passes against it.
      - name: Free tier against latest (informational)
        if: always()
        run: node tools/probe/run.mjs --out "${RUNNER_TEMP}/probe-out-latest"
