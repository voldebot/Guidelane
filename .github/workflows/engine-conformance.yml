# Engine conformance — the free tier only.
#
# WHY THIS FILE CANNOT RUN THE FULL SUITE
# ---------------------------------------
# ADR-001's invariant is that Guidelane never holds a credential, and engines are
# official vendor binaries running under the *user's own login*. A GitHub runner
# has no such login, so `--live` (17 probes that make real engine calls) can only
# ever run on a machine where a human is already signed in.
#
# The split is therefore deliberate, not a limitation we forgot:
#   - here (CI):    free tier — help-text + observational probes, every push + daily.
#                   This is what catches a CLI release changing a flag or a
#                   help-text contract, which is REVIEW-01 #5's remedy.
#   - on a laptop:  `--live`, scheduled locally (see tools/probe/README-ci.md).
#                   This is what catches a change in runtime behaviour.
#
# HONESTY NOTE: the free tier has never been executed on a logged-out machine.
# Probes that shell out to `claude auth status --json` / `auto-mode config` are
# expected to still pass (they assert field *presence*, not a signed-in state),
# but that is reasoning, not measurement — REVIEW-02 B5 covers it. The first CI
# run is the measurement; if a probe fails only because the runner is logged
# out, fix the probe, do not weaken the assertion.

name: engine-conformance

on:
  push:
    paths:
      - 'tools/probe/**'
      - 'docs/research/S0-conformance-*'
      - '.github/workflows/engine-conformance.yml'
  pull_request:
  schedule:
    # 04:00 UTC daily — a new CLI release should be caught before the owner
    # starts work, not halfway through a build.
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  free-tier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Pinning is intentional: an unpinned install would make the probe test a
      # different engine every night, which is the opposite of version
      # governance. Bump this deliberately, then re-run --live locally before
      # the bump lands (CLAUDE.md §3, "tested CLI version range maintained").
      - name: Install the engine under test
        run: npm install -g @anthropic-ai/claude-code@2.1.220

      - name: Record the exercised version
        run: claude --version

      # Written outside the working tree, so the committed baseline cannot be
      # touched even by accident. Exit codes: 0 green · 1 the engine's contract
      # changed · 2 the harness broke · 3 inconclusive (stall/capacity).
      - name: Run the free tier
        run: node tools/probe/run.mjs --out "${RUNNER_TEMP}/probe-out"

      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Deliberately NOT named like the baseline: this is ~10 probes with no
          # live calls, and a reviewer downloading it must not mistake it for the
          # 30-probe conformance report.
          name: s0-conformance-FREE-TIER-partial
          path: ${{ runner.temp }}/probe-out/

      # Fail-closed. A `|| true` here would let a clobbered baseline through
      # green, which is the failure mode this whole job exists to prevent.
      - name: Assert the committed baseline was not modified
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code -- docs/research/

      # The redaction boundary is only as good as its last regression. This is
      # the cheapest possible check that no home path, username, temp-dir salt or
      # address reached a file headed for a public repo.
      - name: Assert the committed artifacts carry no identifiers
        run: |
          set -uo pipefail
          # Case-insensitive, and over EVERY tracked text file. The previous
          # pattern was `/Users/[a-z]`, which does not match `/Users/Talha` —
          # the backstop was strictly weaker than the boundary it backstops, and
          # it only scanned two files while probes now write more.
          #
          # Three files are excluded because their job IS to contain these
          # patterns: the redaction rules themselves, this workflow, and the hook
          # fixture's temp-root allowlist. Excluding them by name keeps the scan
          # honest; widening the pattern to accommodate them would not.
          if git ls-files -z '*.md' '*.json' '*.mjs' '*.yml' '*.sh' \
               ':!tools/probe/lib/redact.mjs' \
               ':!tools/probe/fixtures/plugin/hooks/log-event.sh' \
               ':!.github/workflows/engine-conformance.yml' \
             | xargs -0 grep -nEi '/Users/[a-z]|/home/[a-z]|/var/folders/|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'; then
            echo "::error::Identifier leaked into a committed conformance artifact."
            exit 1
          fi
          echo "No identifiers in the committed artifacts."

  # REVIEW-01 #5's accepted remedy is "a nightly conformance probe against the
  # latest CLI". The pinned job above cannot do that by construction — it always
  # installs the version the suite was validated against, so a new release is
  # invisible to it forever. This job is the other half: it watches for drift
  # between the pin and what npm actually ships, and is allowed to fail loudly
  # without blocking the pinned signal.
  latest-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the latest published CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Compare against the pinned version
        run: |
          set -uo pipefail
          PINNED=$(grep -oE '@anthropic-ai/claude-code@[0-9]+\.[0-9]+\.[0-9]+' \
                     .github/workflows/engine-conformance.yml | head -1 | sed 's/.*@//')
          LATEST=$(claude --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "pinned=$PINNED latest=$LATEST"
          if [ "$PINNED" != "$LATEST" ]; then
            echo "::warning::CLI $LATEST is published; the suite is validated against $PINNED."
            echo "Run the full --live suite locally against $LATEST, then bump the pin and the tested range."
            exit 1
          fi
          echo "Pin is current."

      # Runs regardless of the comparison, so a new release also tells us
      # immediately whether the free tier still passes against it.
      - name: Free tier against latest (informational)
        if: always()
        run: node tools/probe/run.mjs --out "${RUNNER_TEMP}/probe-out-latest"
